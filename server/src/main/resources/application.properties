server.address=${PLATFORM_BIND:127.0.0.1}
server.port=${PLATFORM_PORT:8080}
spring.datasource.url=${PLATFORM_DB_URL:jdbc:h2:file:./data/distilly;AUTO_SERVER=FALSE;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${PLATFORM_DB_USER:sa}
spring.datasource.password=${PLATFORM_DB_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.error.include-message=never
server.error.include-stacktrace=never
platform.demo=${PLATFORM_DEMO:false}
platform.users=${PLATFORM_USERS:[]}
platform.worker-token=${PLATFORM_WORKER_TOKEN:}
platform.lease-seconds=${PLATFORM_LEASE_SECONDS:300}
platform.max-attempts=3
logging.level.root=INFO
