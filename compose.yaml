services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: distilly
      POSTGRES_USER: distilly
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distilly -d distilly"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports: ["127.0.0.1:18080:8080"]
    environment:
      PLATFORM_BIND: 0.0.0.0
      PLATFORM_PORT: "8080"
      PLATFORM_DB_URL: jdbc:postgresql://db:5432/distilly
      PLATFORM_DB_USER: distilly
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      PLATFORM_USERS: ${PLATFORM_USERS:?set PLATFORM_USERS}
      PLATFORM_WORKER_TOKEN: ${PLATFORM_WORKER_TOKEN:?set PLATFORM_WORKER_TOKEN}
      PLATFORM_DEMO: "false"
      PLATFORM_MAX_ACTIVE_TASKS_PER_USER: ${PLATFORM_MAX_ACTIVE_TASKS_PER_USER:-32}
      PLATFORM_TASK_SUBMISSIONS_PER_MINUTE: ${PLATFORM_TASK_SUBMISSIONS_PER_MINUTE:-60}
      PLATFORM_TOTAL_TASK_SUBMISSIONS_PER_MINUTE: ${PLATFORM_TOTAL_TASK_SUBMISSIONS_PER_MINUTE:-120}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      PLATFORM_API_URL: http://api:8080
      PLATFORM_WORKER_TOKEN: ${PLATFORM_WORKER_TOKEN}
      MODEL_MODE: gateway
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-false}
      MODEL_STREAMING: ${MODEL_STREAMING:-true}
      MODEL_OUTPUT_TOKEN_PARAMETER: ${MODEL_OUTPUT_TOKEN_PARAMETER:-max_tokens}
      MODEL_DEFAULT_OUTPUT_TOKENS: ${MODEL_DEFAULT_OUTPUT_TOKENS:-4096}
      MODEL_PERSONA_ANALYSIS_OUTPUT_TOKENS: ${MODEL_PERSONA_ANALYSIS_OUTPUT_TOKENS:-4096}
      MODEL_PERSONA_BUILD_OUTPUT_TOKENS: ${MODEL_PERSONA_BUILD_OUTPUT_TOKENS:-8192}
      MODEL_DISTILL_OUTPUT_TOKENS: ${MODEL_DISTILL_OUTPUT_TOKENS:-4096}
      MODEL_KNOWLEDGE_ANSWER_OUTPUT_TOKENS: ${MODEL_KNOWLEDGE_ANSWER_OUTPUT_TOKENS:-2048}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0}
      VISION_OUTPUT_TOKEN_PARAMETER: ${VISION_OUTPUT_TOKEN_PARAMETER:-${MODEL_OUTPUT_TOKEN_PARAMETER:-max_tokens}}
      VISION_DEFAULT_OUTPUT_TOKENS: ${VISION_DEFAULT_OUTPUT_TOKENS:-4096}
      VISION_TEMPERATURE: ${VISION_TEMPERATURE:-${MODEL_TEMPERATURE:-0}}
      VISION_JSON_MODE: ${VISION_JSON_MODE:-${MODEL_JSON_MODE:-false}}
      VISION_STREAMING: ${VISION_STREAMING:-${MODEL_STREAMING:-true}}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      ASR_MODEL: ${ASR_MODEL:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  db-data:
