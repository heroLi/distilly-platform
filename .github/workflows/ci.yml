name: Platform CI
on: [push, pull_request]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: mvn -B -ntp -f server/pom.xml package
      - run: python3 -m unittest discover -s worker -p 'test_*.py'
      - run: node tests/question_ui_test.cjs
      - run: python3 tests/e2e.py
